# @package _global_
# ──────────────────────────────────────────────────────────────
# Description: Evaluate TarFlow on AAAAAA with SNIS (the "SBG SNIS" row)
# Reference:   Table 3 and Table 9/10, Scalable Equilibrium Sampling with Sequential Boltzmann Generators
#              https://arxiv.org/abs/2502.18462
# Notes:       Run as:
#                python src/transferable_samplers/eval.py \
#                experiment=single_system/eval/tarflow_AAAAAA_snis.yaml \
#                callbacks.sampling_evaluation.sampler.num_samples=1000000
#              Defaults to the model:
#                https://huggingface.co/transferable-samplers/model-weights/tree/main/single_system/tarflow_AAAAAA_0.pth
#              Change the seed with _0 -> _1, _2 to load models with different training seeds
#              One importance-weighting step instead of annealed Langevin dynamics, so the
#              number of target energy evaluations equals num_samples.
# ──────────────────────────────────────────────────────────────
defaults:
  - override /model: normalizing_flow
  - override /model/net: tarflow_single_system
  - override /data: single_system/AAAAAA
  - override /trainer: gpu
hf_state_dict_path: single_system/tarflow_AAAAAA_0.pth
model:
  net:
    channels: 384
    img_size: 189
    num_blocks: 6
    layers_per_block: 6
  source_energy_config:
    sample_batch_size: 2048
    energy_batch_size: 512
    grad_batch_size: 512
    use_com_adjustment: true
callbacks:
  sampling_evaluation:
    sampler:
      _target_: transferable_samplers.samplers.snis_sampler.SNISSampler
      num_samples: 10_000
      logw_quantile_filter: 0.002
